    tty: true
    volumes:
      - ../../../.:/Security-Scripts
  opensuse-leap-15:
    image: opensuse/leap:15
    container_name: security-scripts-testing-opensuse-15
    stdin_open: true
    tty: true
    volumes:
      - ../../../.:/Security-Scripts