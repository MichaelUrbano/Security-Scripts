# For automated local tests, this builds Dockerfiles, and runs bats tests as defined in the environment variable TESTS, defined in .env
services:
  debian:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/debian.Dockerfile
    container_name: security-scripts-testing-debian-latest
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    command: >
      bash -c "${TESTS}"

  ubuntu:
