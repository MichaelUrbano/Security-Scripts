# For automated local tests, this builds Dockerfiles, and runs bats tests as defined in the environment variable TESTS, defined in .env
# View compose.yaml to see an example service
# Containers can be started with a specific profile with docker compose --profile <name> up -d
# Each profile has sets of containers that each follow some kind of purpose, or release date
  # "all": Will start all containers within the compose file (not recommended)
  # "latest": Starts containers which use the "latest" tag (with oraclelinux being the exception, given it doesn't have a latest tag)
  # "stable": Similar to "latest", just that it will instead pull the containers by their latest version number, rather than with the latest tag
  # "LTS": Starts containers that still receive security or maintenance support, but no feature updates
  # "EOL": Starts containers which have reached "End-Of-Life", and receive no maintenance whatsoever
services:  
  debian:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/debian.Dockerfile
    container_name: security-scripts-testing-debian-latest
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    profiles:
      - "all"
      - "latest"
    command: >
      bash -c "${TESTS}"

  ubuntu:
