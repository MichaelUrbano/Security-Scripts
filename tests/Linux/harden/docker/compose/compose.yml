# For manual local tests, this builds Dockerfiles, but does not run any bats tests, allowing for you to run
# docker exec -it security-scripts-testing-<name>-<version> /bin/bash
services:
  # Can name whatever you like, or you can use the naming scheme <distribution>-<version>
  example:
    build:
      # Context should be root of repository so all files can be seen.
      context: ../../../../../
      # Replace with Dockerfile you want to build,
      # see example.Dockerfile for general format required.
      dockerfile: tests/Linux/harden/docker/Dockerfile/example.Dockerfile
    # Can name whatever you like, or you can use the naming scheme security-scripts-testing-<distribution>-<version>
    container_name: security-scripts-testing-example
    # Must be privileged & have capabilities added to test certain features, like changing firewall configurations.
    privileged: true
    cap_add:
      - NET_ADMIN
    # Not strictly necessary when doing automated tests, but necessary when doing manual tests
    stdin_open: true
    tty: true
    # You will want to put your service under the "all" and "custom" profiles, so that they can be started with
    # docker compose -f tests/Linux/harden/docker/compose/compose.yml --profile <name> up -d
    profiles:
      - "all"
      - "example"
    # Section below can be uncommented to run automated tests, either by the tests defined in .env, or
    # tests you choose yourself.
    # command: >
    #   bash -c "${TESTS}"

  debian:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/debian.Dockerfile
    container_name: security-scripts-testing-manual-debian
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true

  ubuntu:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/ubuntu.Dockerfile
    container_name: security-scripts-testing-manual-ubuntu
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true

  oraclelinux:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/oraclelinux-10.Dockerfile
    container_name: security-scripts-testing-manual-oraclelinux
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true

  fedora:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/fedora.Dockerfile
    container_name: security-scripts-testing-manual-fedora
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true

  opensuse-leap:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/opensuse-leap.Dockerfile
    container_name: security-scripts-testing-manual-opensuse-leap
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
