# For manual local tests, this builds Dockerfiles, but does not run any bats tests, allowing for you to run
# docker exec -it security-scripts-testing-<name>-<version> /bin/bash
services:
  # Can name whatever you like, or you can use the naming scheme <distribution>-<version>
  example:
    build:
      # Context should be root of repository so all files can be seen.
      context: ../../../../../
      # Replace with Dockerfile you want to build,
      # see example.Dockerfile for general format required.
      dockerfile: tests/Linux/harden/docker/Dockerfile/example.Dockerfile
    # Can name whatever you like, or you can use the naming scheme security-scripts-testing-<distribution>-<version>
    container_name: security-scripts-testing-example
    # Must be privileged & have capabilities added to test certain features, like changing firewall configurations.
    privileged: true
    cap_add:
      - NET_ADMIN
    # Not strictly necessary, can remove these two lines if desired
    stdin_open: true
    tty: true
  debian:
    build:
      context: ../../../../../
      dockerfile: tests/Linux/harden/docker/Dockerfile/debian.Dockerfile
    container_name: security-scripts-testing-debian-latest
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true

  ubuntu:
